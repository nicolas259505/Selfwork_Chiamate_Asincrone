<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork Chiamate Asincrone</title>
    <!-- Bootstrap css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="text-center">
        <p>Inserisci i secondi per il countdown
        </p>
    </div>
    
    <div class="d-flex align-items-center justify-content-center">
        
        <input id="numero" class="num" type="number">

        
    </div>

    <div class="d-flex justify-content-center align-items-center mt-5 mb-5 timer" id="risultato">0</div>
    
    <section class="container-fluid">
        <section class="row mt-5">
            <div class="col-4 d-flex justify-content-center align-items-center">
                <button id="start">Start</button>
            </div>
            <div class="col-4 d-flex justify-content-center align-items-center">
                <button id="pausa">Pausa</button>
            </div>
            <div class="col-4 d-flex justify-content-center align-items-center">
                <button id="stop">Reset</button>
            </div>
        </section>
    </section>






    <!-- bootstrap js -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="main.js"></script>
</body>
</html>
